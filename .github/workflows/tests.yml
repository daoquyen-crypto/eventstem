name: Kiểm thử công cụ quản lý giải

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "supabase/**"
      - "tests/**"
      - "*.html"
      - "css/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Luật Engage, Achieve, ADC (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.js

  schema:
    name: Schema + phân quyền (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/schema_test.sh

  e2e:
    name: Giao diện (Playwright, chế độ demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8767 >/dev/null 2>&1 &
          sleep 1
          node tests/e2e_manage.js
          node tests/e2e_achieve.js
          node tests/e2e_adc.js
